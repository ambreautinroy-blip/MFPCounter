[project]
name = "ductcount"
version = "0.1.0"
description = "Count mammary ducts in stitched H&E microscope fields: web app for manual counting + U-Net detector"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.161.1",
    "numpy>=2.5.4",
    "opencv-python-headless>=5.0.0.93",
    "pandas>=3.1.0",
    "pillow>=13.0.0",
    "scikit-image>=0.26.0",
    "scipy>=1.18.1",
    "segmentation-models-pytorch>=0.5.0",
    "tifffile>=2026.10.15",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
ductcount = "ductcount.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ductcount"]
exclude = ["ductcount/cache", "ductcount/models"]

[dependency-groups]
dev = [
    "playwright>=1.64.1",
]
